name: App build and protocol regression tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4.0.4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Test protocol and GATT queue
        run: |
          mkdir -p build/tests
          javac -encoding UTF-8 -d build/tests test/app/src/main/java/com/test/GattQueue.java test/app/src/main/java/com/test/SmartglassesProtocol.java tests/GattQueueTest.java
          java -cp build/tests GattQueueTest
      - name: Build Android app
        working-directory: test
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest lintDebug lintRelease assembleDebug assembleRelease --no-daemon
      - name: Test APK publication and verify prepared owner-signed APK
        run: |
          python3 -m unittest discover -s tests -p 'test_*.py'
          python3 tools/app_release.py --sdk "$ANDROID_HOME" --reference test/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: android-test-and-lint-results
          path: |
            test/app/build/reports/
            test/app/build/test-results/
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: smartglasses-app-debug
          path: test/app/build/outputs/apk/debug/*.apk
  publish:
    needs: android
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev/firmware-fixes-ota'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: smartglasses-app-releases
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Publish verified signed APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/app_release.py --publish
