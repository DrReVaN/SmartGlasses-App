plugins {
    id 'com.android.application'
}

android {
    namespace 'com.test'
    compileSdk 36

    defaultConfig {
        applicationId "com.test"
        minSdk 21
        targetSdk 36
        versionCode 6
        versionName "1.2.1"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    testOptions { unitTests.includeAndroidResources = true }
    lint { abortOnError = true; warningsAsErrors = true; checkReleaseBuilds = true }
    def signing = ['SMARTGLASSES_KEYSTORE','SMARTGLASSES_STORE_PASSWORD','SMARTGLASSES_KEY_ALIAS','SMARTGLASSES_KEY_PASSWORD'].collect { System.getenv(it) }
    if (signing.every { it }) {
        signingConfigs {
            ownerRelease {
                storeFile file(signing[0]); storePassword signing[1]
                keyAlias signing[2]; keyPassword signing[3]
            }
        }
        buildTypes.release.signingConfig signingConfigs.ownerRelease
    }
}

dependencies {

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.16.1'
}
